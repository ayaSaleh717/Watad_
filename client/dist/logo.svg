<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-labelledby="title desc">
  <title id="title">Watad Petroleum logo</title>
  <desc id="desc">A gold petroleum flame mark above the Arabic name وتد للبترول and English name WATAD PETROLEUM.</desc>
  <defs>
    <linearGradient id="brown-left" x1="23" y1="11" x2="99" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b1406" />
      <stop offset=".55" stop-color="#5a2f0d" />
      <stop offset="1" stop-color="#201005" />
    </linearGradient>
    <linearGradient id="brown-right" x1="177" y1="11" x2="101" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b1406" />
      <stop offset=".55" stop-color="#63360f" />
      <stop offset="1" stop-color="#261205" />
    </linearGradient>
    <linearGradient id="gold-left" x1="54" y1="23" x2="100" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd832" />
      <stop offset=".55" stop-color="#ffc107" />
      <stop offset="1" stop-color="#f3ad05" />
    </linearGradient>
    <linearGradient id="gold-right" x1="146" y1="23" x2="100" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#efad00" />
      <stop offset=".55" stop-color="#e19c00" />
      <stop offset="1" stop-color="#cc8700" />
    </linearGradient>
    <linearGradient id="center-shade" x1="95" y1="0" x2="105" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe45a" stop-opacity=".45" />
      <stop offset="1" stop-color="#6e4400" stop-opacity=".16" />
    </linearGradient>
    <style>
      .arabic-wordmark {
        fill: #2f3030;
        font-family: Cairo, Tajawal, Arial, sans-serif;
        font-size: 45px;
        font-weight: 900;
      }

      .english-wordmark {
        fill: #2f3030;
        font-family: Montserrat, Arial, sans-serif;
        font-size: 25px;
        font-weight: 800;
        letter-spacing: .035em;
      }
    </style>
  </defs>

  <g transform="translate(160 15)">
    <path d="M61 5C44 44 23 97 20 145c-2 33 11 61 39 78-9-30-5-65 7-101 9-28 24-64 34-94L85 47Z" fill="url(#brown-left)" />
    <path d="M139 5c17 39 38 92 41 140 2 33-11 61-39 78 9-30 5-65-7-101-9-28-24-64-34-94l15 19Z" fill="url(#brown-right)" />
    <path d="M100 0C78 42 56 76 45 116c-13 48-1 85 26 108 9 8 19 13 29 14Z" fill="url(#gold-left)" />
    <path d="M100 0c22 42 44 76 55 116 13 48 1 85-26 108-9 8-19 13-29 14Z" fill="url(#gold-right)" />
    <path d="M100 0v238c10-1 20-6 29-14 27-23 39-60 26-108C144 76 122 42 100 0Z" fill="url(#center-shade)" />
    <path d="M100 0 88 25c-11 25-22 50-30 78 14-24 28-49 42-103Z" fill="#fff6b0" opacity=".16" />
    <path d="M100 0c22 42 44 76 55 116 13 48 1 85-26 108-9 8-19 13-29 14-10-1-20-6-29-14-27-23-39-60-26-108C56 76 78 42 100 0Z" fill="none" stroke="#8e360f" stroke-width="2" stroke-linejoin="round" opacity=".55" />
  </g>

  <line x1="140" y1="266" x2="380" y2="266" stroke="#8f8f8f" stroke-width="2" stroke-linecap="round" />
  <text class="arabic-wordmark" x="260" y="313" text-anchor="middle" direction="rtl">وتد للبترول</text>
  <text class="english-wordmark" x="260" y="343" text-anchor="middle">WATAD PETROLEUM</text>
</svg>
